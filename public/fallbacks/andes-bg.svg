  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1500" cy="260" r="420" fill="url(#sun)"/>
  <!-- Nubes suaves -->
  <ellipse cx="420" cy="240" rx="180" ry="52" fill="#FFFFFF" opacity="0.65"/>
  <ellipse cx="520" cy="225" rx="130" ry="45" fill="#FFFFFF" opacity="0.75"/>
  <ellipse cx="1050" cy="190" rx="160" ry="46" fill="#FFFFFF" opacity="0.6"/>
  <!-- Colinas verdes y campus escolar -->
  <path d="M0,760 Q480,620 960,730 T1920,690 L1920,1080 L0,1080 Z" fill="#16A34A" opacity="0.7"/>
  <path d="M0,830 Q620,710 1280,820 T1920,790 L1920,1080 L0,1080 Z" fill="url(#hills)"/>
</svg>
