<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120D0A"/>
      <stop offset="38%" stop-color="#3D1E14"/>
      <stop offset="72%" stop-color="#B84322"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.58" r="0.35">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#E07A5F" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#120D0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="960" cy="620" r="650" fill="url(#sun)"/>
  <!-- Cordillera lejana -->
  <polygon points="0,720 260,410 540,610 860,330 1190,590 1510,360 1920,640 1920,1080 0,1080" fill="#2A1812" opacity="0.85"/>
  <!-- Apus medios -->
  <polygon points="0,800 380,480 710,720 1080,440 1440,700 1760,490 1920,730 1920,1080 0,1080" fill="#1E130E"/>
  <!-- Río Apurímac -->
  <polygon points="760,710 1140,710 1380,1080 520,1080" fill="url(#river)" opacity="0.75"/>
  <!-- Acantilados del cañón -->
  <polygon points="0,620 620,730 560,1080 0,1080" fill="#140D0A"/>
  <polygon points="1920,600 1290,730 1350,1080 1920,1080" fill="#140D0A"/>
  <!-- Cuerdas del puente Q'eswachaka -->
  <path d="M 550 700 Q 960 860 1360 700" stroke="#F4A261" stroke-width="8" fill="none" stroke-dasharray="26 14" opacity="0.9"/>
  <path d="M 540 650 Q 960 810 1370 650" stroke="#D95D39" stroke-width="5" fill="none" opacity="0.8"/>
  <path d="M 560 735 Q 960 895 1350 735" stroke="#FDE68A" stroke-width="12" fill="none" stroke-dasharray="40 18" opacity="0.85"/>
</svg>
